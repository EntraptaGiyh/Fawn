<!DOCTYPE html>
<html>

<head>
<title>corações</title>

<style>
body{
background: black;
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
flex-direction: column;
font-family: Arial;
overflow: hidden;
}

button{
padding: 15px 30px;
font-size: 20px;
border: none;
border-radius: 10px;
background: hotpink;
color: white;
cursor: pointer;
}

.coracao{
position: absolute;
font-size: 24px;
animation: cair 3s linear forwards;
}

@keyframes cair{
0%{
transform: translateY(-10vh);
opacity: 1;
}
100%{
transform: translateY(100vh);
opacity: 0;
}
}

</style>

</head>

<body>

<button onclick="criarCoracao()">clique aqui 💗</button>

<script>

function criarCoracao(){

let coracao =
document.createElement("div")

coracao.innerHTML = "💗"

coracao.classList.add("coracao")

coracao.style.left = Math.random()*100+"vw"

document.body.appendChild(coracao)

setTimeout(()=>{
coracao.remove()
},3000)

}
</script>  

</body>

</html>
